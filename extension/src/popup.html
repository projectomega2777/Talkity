<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Talkity Voice Dictation</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 8px;
      background: #1e293b;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
    }
    .dot.connected {
      background: #10b981;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #6366f1;
      color: white;
      margin-bottom: 12px;
    }
    .btn-primary:hover {
      background: #4f46e5;
    }
    .btn-primary.recording {
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }
    .settings-group {
      margin-top: 16px;
      border-top: 1px solid #1e293b;
      padding-top: 12px;
    }
    label {
      font-size: 12px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 12px;
    }
    .transcript-box {
      margin-top: 12px;
      padding: 10px;
      background: #1e293b;
      border-radius: 6px;
      font-size: 12px;
      min-height: 40px;
      max-height: 80px;
      overflow-y: auto;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <h2>🎙️ Talkity Dictation</h2>
  <div class="status-badge" id="statusBadge">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Connecting to server...</span>
  </div>

  <button id="recordBtn" class="btn btn-primary">
    <span>🔴</span> <span id="recordBtnText">Start Recording</span>
  </button>

  <div class="transcript-box" id="transcriptBox">Click 'Start Recording' to dictate into the active element...</div>

  <div class="settings-group">
    <label for="serverUrlInput">Talkity Server URL</label>
    <input type="text" id="serverUrlInput" value="ws://localhost:3000">
  </div>

  <script src="popup.js"></script>
</body>
</html>
